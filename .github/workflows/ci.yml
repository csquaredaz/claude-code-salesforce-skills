name: ci

# Every job here is free: GitHub-hosted runners on a public repo, open-source tools, and
# `claude plugin validate`, which is a local schema check that makes no model calls.
# Paid steps are deliberately omitted. See docs/adr/0002-eval-strategy.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  lint:
    name: lint (prettier + markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  plugin:
    name: plugin schema (claude plugin validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The CLI is installed only for its offline validator. No ANTHROPIC_API_KEY is configured
      # on purpose: validation makes no model calls, and eval runs stay local (ADR 0002).
      - run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate every plugin
        run: |
          for dir in plugins/*/; do
            claude plugin validate --strict "$dir"
          done

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The pinned release binary is used directly instead of a marketplace action, so the
      # scan has no licence or third-party action dependency.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
